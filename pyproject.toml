[project]
name = "best-by"
version = "0.1.0"
description = "An agent that watches the FDA food recall feed against what a food pantry actually has on its shelves."
requires-python = ">=3.11"
dependencies = [
    "strands-agents>=1.55",
    "anthropic>=0.40",
    "boto3>=1.35",
    "httpx>=0.27",
    "pillow>=10.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent*"]
